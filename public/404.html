<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akwasi Unblocked Games</title>
    <script>
      // GitHub Pages SPA redirect: preserves path and redirects to main page
      var l = window.location;
      var repoName = l.pathname.split('/')[1] || '';
      var target = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '');
      if (repoName && !repoName.includes('.')) {
        target += '/' + repoName + '/';
      } else {
        target += '/';
      }
      window.location.replace(target);
    </script>
    <meta http-equiv="refresh" content="0; url=./" />
  </head>
  <body style="background:#090d16;color:#94a3b8;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;">
    <h2 style="color:#fff;font-size:1.25rem;margin-bottom:0.5rem;">Redirecting to Akwasi Unblocked Games...</h2>
    <p style="font-size:0.875rem;">If you are not redirected automatically, <a href="./" style="color:#06b6d4;">click here</a>.</p>
  </body>
</html>
