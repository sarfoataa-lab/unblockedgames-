    <script>
      // Isolate any third-party browser extension errors (e.g. injected content.js or chrome-extension:// scripts)
      window.addEventListener('error', function(e) {
        var fn = (e && e.filename) || '';
        var msg = (e && e.message) || '';
        if (
          fn.indexOf('chrome-extension://') !== -1 ||
          fn.indexOf('moz-extension://') !== -1 ||
          fn.indexOf('content.js') !== -1 ||
          fn.indexOf('popup.js') !== -1 ||
          (msg.indexOf('Cannot set properties of null') !== -1 && fn.indexOf('extension') !== -1)
        ) {
          e.preventDefault && e.preventDefault();
          e.stopPropagation && e.stopPropagation();
          return true;
        }
      }, true);
    </script>
